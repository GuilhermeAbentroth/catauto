spring.application.name=automoveis-teste

# Os testes usam um banco H2 em memoria, para nunca tocar no banco de arquivo
# (e nao conflitar com o servidor rodando).
spring.datasource.url=jdbc:h2:mem:automoveis-teste;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
