spring.application.name=automoveis

server.port=8081

# Banco H2 em arquivo (os dados sobrevivem ao reinicio do servidor).
# O arquivo fica em .\data\catauto.mv.db dentro do projeto.
spring.datasource.url=jdbc:h2:file:./data/catauto
spring.datasource.driverClassName=org.h2.Driver
# Credenciais podem vir de variaveis de ambiente (DB_USERNAME / DB_PASSWORD); o valor apos ":" e o padrao local.
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update

# Carrega associacoes LAZY em lote (evita o problema N+1 nas listagens).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Console do banco: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
